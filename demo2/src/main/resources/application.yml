spring:
  application:
    name: demo2
  datasource:
    url: jdbc:h2:file:./data/codereview
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

groq:
  api:
    key: "your_api_key"
